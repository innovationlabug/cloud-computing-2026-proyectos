<title id="estudio-3d-arq-title">Arquitectura de Estudio 3D</title>
<desc id="estudio-3d-arq-desc">El navegador y el puente de cámara del taller entran por CloudFront, que pasa por un Application Load Balancer a la API Flask en EC2; EC2 guarda los .stl cifrados en S3 y usa Supabase para sesión y datos. El formulario de contacto va a una Lambda que guarda el mensaje en Supabase y publica en SNS, que avisa al negocio por correo. IAM da permisos mínimos a EC2 y a Lambda, CloudWatch mide la EC2 y GitHub Actions despliega por SSH.</desc>
